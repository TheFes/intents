---
# HassGetState - name_zone

language: "nl"
entities:
  - name: "Jan"
    domain: "person"
    state: "thuis"
  - name: "Piet"
    domain: "person"
    state: "home"
  - name: "Klaas"
    domain: "person"
    state: "not_home"

tests:
  - sentences:
      - "is jan thuis"
      - "is jan al thuis"
      - "zit jan thuis"
      - "is jan in de zone thuis"
    slots:
      name: "Jan"
      state: "thuis"
    response: "Ja"

  - sentences:
      - "is piet op het werk"
    slots:
      name: "Piet"
      state: "werk"
    response: "Nee, die is thuis"

  - sentences:
      - "is klaas thuis"
    slots:
      name: "Klaas"
      state: "thuis"
    response: "Nee, die is niet thuis"
