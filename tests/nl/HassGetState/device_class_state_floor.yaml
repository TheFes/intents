---
# HassGetState - device_class_state_floor

language: "nl"
floors:
  - name: "Boven"
  - name: "Tweede verdieping"

areas:
  - name: "Overloop"
    floor: "Boven"
  - name: "Slaapkamer"
    floor: "Tweede verdieping"
  - name: "Hal"
    floor: "Eerste verdieping"

entities:
  # on floor Boven, for the floors used as an adverb
  - name: "Overloopraam"
    domain: "cover"
    state: "open"
    area: "Overloop"
    attributes:
      device_class: "window"
  # on a different floor: must be EXCLUDED from Tweede verdieping queries
  - name: "Halraam"
    domain: "cover"
    state: "open"
    area: "Hal"
    attributes:
      device_class: "window"
  - name: "Slaapkamerraam"
    domain: "cover"
    state: "open"
    area: "Slaapkamer"
    attributes:
      device_class: "window"
  - name: "Babykamerraam"
    domain: "cover"
    state: "closed"
    area: "Slaapkamer"
    attributes:
      device_class: "window"
tests:
  - sentences:
      - "is er een tweede verdieping raam open"
      - "is er een raam open op de tweede verdieping"
      - "zijn er ramen open op de tweede verdieping"
      - "zijn er tweede verdieping ramen open"
      - "is er op de tweede verdieping een raam open"
      - "zijn er op de tweede verdieping ramen open"
    slots: { device_class: "window", state: "open", floor: "Tweede verdieping" }
    response: "Ja, Slaapkamerraam"
  - sentences:
      - "zijn alle tweede verdieping ramen dicht"
      - "zijn alle ramen dicht op de tweede verdieping"
      - "is elk raam dicht op de tweede verdieping"
      - "zijn de ramen op de tweede verdieping dicht"
      - "is elk raam op de tweede verdieping dicht"
      - "zijn op de tweede verdieping de ramen dicht"
    slots: { device_class: "window", state: "closed", floor: "Tweede verdieping" }
    response: "Nee, Slaapkamerraam niet"
  - sentences:
      - "welke tweede verdieping ramen zijn open"
      - "welke ramen zijn open op de tweede verdieping"
      - "welk raam is open op de tweede verdieping"
      - "welke ramen zijn op de tweede verdieping open"
      - "welke ramen op de tweede verdieping zijn open"
      - "welk raam is op de tweede verdieping open"
    slots: { device_class: "window", state: "open", floor: "Tweede verdieping" }
    response: "Slaapkamerraam"
  - sentences:
      - "hoeveel tweede verdieping ramen zijn open"
      - "hoeveel ramen zijn open op de tweede verdieping"
      - "hoeveel ramen zijn op de tweede verdieping open"
      - "hoeveel ramen op de tweede verdieping zijn open"
    slots: { device_class: "window", state: "open", floor: "Tweede verdieping" }
    response: "1"
  - sentences:
      - "is er boven een raam open"
      - "zijn er boven ramen open"
    slots: { device_class: "window", state: "open", floor: "Boven" }
    response: "Ja, Overloopraam"
  - sentences:
      - "zijn de ramen boven dicht"
      - "zijn boven de ramen dicht"
    slots: { device_class: "window", state: "closed", floor: "Boven" }
    response: "Nee, Overloopraam niet"
  - sentences:
      - "welke ramen zijn boven open"
      - "welk raam is boven open"
    slots: { device_class: "window", state: "open", floor: "Boven" }
    response: "Overloopraam"
  - sentences:
      - "hoeveel ramen zijn boven open"
    slots: { device_class: "window", state: "open", floor: "Boven" }
    response: "1"
