---
# HassGetState - name_state

language: "nl"
entities:
  - name: "Keukenlamp"
    domain: "light"
    state: "on"
  - name: "Kerstlampjes"
    domain: "light"
    state: "on"
  - name: "Hallamp"
    domain: "light"
    state: "off"
  - name: "Garagedeur"
    domain: "cover"
    state: "open"
  - name: "Waterklep"
    domain: "valve"
    state: "open"
  - name: "Voordeur"
    domain: "lock"
    state: "locked"
  - name: "Terrasdeur"
    domain: "binary_sensor"
    state: "on"
  - name: "Kantoorsensor"
    domain: "binary_sensor"
    state: "on"

tests:
  # on/off domain
  - sentences:
      - "is de keukenlamp aan"
      - "staat de keukenlamp aan"
      - "brandt de keukenlamp"
    slots:
      name: "Keukenlamp"
      state: "on"
    response: "Ja"

  # one_yesno "No" branch: entity is in the opposite state
  - sentences:
      - "is de hallamp aan"
    slots:
      name: "Hallamp"
      state: "on"
    response: "Nee, die is off"

  - sentences:
      - "is de garagedeur open"
      - "staat de garagedeur open"
    slots:
      name: "Garagedeur"
      state: "open"
    response: "Ja"

  - sentences:
      - "is de waterklep geopend"
    slots:
      name: "Waterklep"
      state: "open"
    response: "Ja"

  - sentences:
      - "is de voordeur op slot"
      - "zit de voordeur op slot"
      - "is de voordeur afgesloten"
    slots:
      name: "Voordeur"
      state: "locked"
    response: "Ja"

  # binary sensor - opening
  - sentences:
      - "is de terrasdeur open"
      - "is de terrasdeur geopend"
    slots:
      name: "Terrasdeur"
      state: "on"
    response: "Ja"

  # binary sensor - occupancy
  - sentences:
      - "is de kantoorsensor bezet"
      - "is de kantoorsensor in gebruik"
    slots:
      name: "Kantoorsensor"
      state: "on"
    response: "Ja"

  - sentences:
      - "branden de kerstlampjes"
      - "staan de kerstlampjes aan"
    slots:
      name: "Kerstlampjes"
      state: "on"
    response: "Ja"
