---
# HassGetState - domain_state
#
# Cardinalities exercise the response rendering:
#   lights  = 5 on / 1 off  -> ">4" truncation ("... en nog N")
#   fans    = 2 on / 1 off  -> multi-entity join ("A en B")
#   switch  = 1 on / 1 off  -> single entity

language: "nl"
entities:
  - name: "Lamp A"
    domain: "light"
    state: "on"
  - name: "Lamp B"
    domain: "light"
    state: "on"
  - name: "Lamp C"
    domain: "light"
    state: "on"
  - name: "Lamp D"
    domain: "light"
    state: "on"
  - name: "Lamp E"
    domain: "light"
    state: "on"
  - name: "Lamp F"
    domain: "light"
    state: "off"
  - name: "Zolderventilator"
    domain: "fan"
    state: "on"
  - name: "Plafondventilator"
    domain: "fan"
    state: "on"
  - name: "Badkamerventilator"
    domain: "fan"
    state: "off"
  - name: "Stopcontact schakelaar"
    domain: "switch"
    state: "on"
  - name: "Veranda schakelaar"
    domain: "switch"
    state: "off"
  - name: "Voordeur"
    domain: "lock"
    state: "locked"
  - name: "Achterdeur"
    domain: "lock"
    state: "unlocked"
  - name: "Jan"
    domain: "person"
    state: "thuis"
  - name: "Piet"
    domain: "person"
    state: "weg"
tests:
  - sentences:
      - "is er een lamp aan"
      - "zijn er lampen aan"
    slots: { state: "on" }
    response: "Ja, Lamp A, Lamp B, Lamp C en nog 2"
  - sentences:
      - "zijn alle lampen uit"
      - "zijn de lampen uit"
      - "is elke lamp uit"
      - "zijn overal de lampen uit"
      - "zijn de lampen overal uit"
    slots: { state: "off" }
    response: "Nee, Lamp A, Lamp B, Lamp C en nog 2 niet"
  - sentences:
      - "welke lampen zijn aan"
      - "welke lamp is aan"
    slots: { state: "on" }
    response: "Lamp A, Lamp B, Lamp C en nog 2"
  - sentences:
      - "hoeveel lampen zijn aan"
    slots: { state: "on" }
    response: "5"
  - sentences:
      - "is er een ventilator aan"
      - "zijn er ventilatoren aan"
    slots: { state: "on" }
    response: "Ja, Plafondventilator en Zolderventilator"
  - sentences:
      - "zijn alle ventilatoren uit"
      - "is elke ventilator uit"
      - "zijn overal de ventilatoren uit"
      - "zijn de ventilatoren overal uit"
    slots: { state: "off" }
    response: "Nee, Plafondventilator en Zolderventilator niet"
  - sentences:
      - "welke ventilatoren zijn aan"
      - "welke ventilator is aan"
    slots: { state: "on" }
    response: "Plafondventilator en Zolderventilator"
  - sentences:
      - "hoeveel ventilatoren zijn aan"
    slots: { state: "on" }
    response: "2"
  - sentences:
      - "is er een schakelaar aan"
      - "zijn er schakelaars aan"
    slots: { state: "on" }
    response: "Ja, Stopcontact schakelaar"
  - sentences:
      - "zijn alle schakelaars uit"
      - "is elke schakelaar uit"
      - "zijn overal de schakelaars uit"
      - "zijn de schakelaars overal uit"
    slots: { state: "off" }
    response: "Nee, Stopcontact schakelaar niet"
  - sentences:
      - "welke schakelaars zijn aan"
      - "welke schakelaar is aan"
    slots: { state: "on" }
    response: "Stopcontact schakelaar"
  - sentences:
      - "hoeveel schakelaars zijn aan"
    slots: { state: "on" }
    response: "1"
  - sentences:
      - "is er een deur ontgrendeld"
      - "zijn er sloten ontgrendeld"
    slots: { state: "unlocked" }
    response: "Ja, Achterdeur"
  - sentences:
      - "zijn alle deuren op slot"
      - "is elke deur op slot"
      - "zijn overal de sloten op slot"
      - "zijn de sloten overal op slot"
    slots: { state: "locked" }
    response: "Nee, Achterdeur niet"
  - sentences:
      - "welke deuren zijn ontgrendeld"
      - "welke deur is ontgrendeld"
    slots: { state: "unlocked" }
    response: "Achterdeur"
  - sentences:
      - "hoeveel deuren zijn op slot"
    slots: { state: "locked" }
    response: "1"
  - sentences:
      - "is er iemand thuis"
    slots: { state: "thuis" }
    response: "Ja, Jan"
  - sentences:
      - "is iedereen thuis"
    slots: { state: "thuis" }
    response: "Nee, Piet niet"
  - sentences:
      - "wie is er thuis"
      - "wie is er allemaal thuis"
    slots: { state: "thuis" }
    response: "Jan"
  - sentences:
      - "hoeveel mensen zijn er thuis"
    slots: { state: "thuis" }
    response: "1"
