---
# HassGetState - domain_state
#
# Cardinalities exercise the response rendering:
#   lights  = 5 on / 1 off  -> ">4" truncation ("... en nog N")
#   fans    = 2 on / 1 off  -> multi-entity join ("A en B")
#   switch  = 1 on / 1 off  -> single entity

language: "nl"
entities:
  - name: "Lamp A"
    domain: "light"
    state: "on"
  - name: "Lamp B"
    domain: "light"
    state: "on"
  - name: "Lamp C"
    domain: "light"
    state: "on"
  - name: "Lamp D"
    domain: "light"
    state: "on"
  - name: "Lamp E"
    domain: "light"
    state: "on"
  - name: "Lamp F"
    domain: "light"
    state: "off"
  - name: "Zolderventilator"
    domain: "fan"
    state: "on"
  - name: "Plafondventilator"
    domain: "fan"
    state: "on"
  - name: "Badkamerventilator"
    domain: "fan"
    state: "off"
  - name: "Stopcontact schakelaar"
    domain: "switch"
    state: "on"
  - name: "Veranda schakelaar"
    domain: "switch"
    state: "off"
  - name: "Voordeur"
    domain: "lock"
    state: "locked"
  - name: "Achterdeur"
    domain: "lock"
    state: "unlocked"
  - name: "Jan"
    domain: "person"
    state: "thuis"
  - name: "Piet"
    domain: "person"
    state: "weg"
tests:
  - sentences:
      - "is er een lamp aan"
      - "zijn er lampen aan"
    slots: { state: "on" }
    response: "Ja, Lamp A, Lamp B, Lamp C en nog 2"
  - sentences:
      - "zijn alle lampen uit"
      - "zijn de lampen uit"
      - "is elk licht uit"
      - "zijn overal de lampen uit"
      - "zijn de lampen overal uit"
    slots: { state: "off" }
    response: "Nee, Lamp A, Lamp B, Lamp C en nog 2 niet"
  - sentences:
      - "welke lampen zijn aan"
      - "welk licht is aan"
    slots: { state: "on" }
    response: "Lamp A, Lamp B, Lamp C en nog 2"
  - sentences:
      - "hoeveel lampen zijn aan"
    slots: { state: "on" }
    response: "5"
  - sentences:
      - "brandt er een lamp"
      - "branden er lampen"
    slots: { state: "on" }
    response: "Ja, Lamp A, Lamp B, Lamp C en nog 2"
  - sentences:
      - "branden de lampen"
      - "brandt elk licht"
      - "branden overal de lampen"
      - "branden de lampen overal"
    slots: { state: "on" }
    response: "Nee, Lamp F niet"
  - sentences:
      - "welke lampen branden"
      - "welk licht brandt"
    slots: { state: "on" }
    response: "Lamp A, Lamp B, Lamp C en nog 2"
  - sentences:
      - "hoeveel lampen branden"
    slots: { state: "on" }
    response: "5"
  - sentences:
      - "is er een ventilator aan"
      - "zijn er fans aan"
    slots: { state: "on" }
    response: "Ja, Plafondventilator en Zolderventilator"
  - sentences:
      - "zijn alle ventilatoren uit"
      - "is elke fan uit"
      - "zijn overal de fans uit"
      - "zijn de fans overal uit"
    slots: { state: "off" }
    response: "Nee, Plafondventilator en Zolderventilator niet"
  - sentences:
      - "welke ventilatoren zijn aan"
      - "welke fan is aan"
    slots: { state: "on" }
    response: "Plafondventilator en Zolderventilator"
  - sentences:
      - "hoeveel ventilatoren zijn aan"
    slots: { state: "on" }
    response: "2"
  - sentences:
      - "is er een schakelaar aan"
      - "zijn er switches aan"
    slots: { state: "on" }
    response: "Ja, Stopcontact schakelaar"
  - sentences:
      - "zijn alle schakelaars uit"
      - "is elke switch uit"
      - "zijn overal de switches uit"
      - "zijn de switches overal uit"
    slots: { state: "off" }
    response: "Nee, Stopcontact schakelaar niet"
  - sentences:
      - "welke schakelaars zijn aan"
      - "welke switch is aan"
    slots: { state: "on" }
    response: "Stopcontact schakelaar"
  - sentences:
      - "hoeveel schakelaars zijn aan"
    slots: { state: "on" }
    response: "1"
  - sentences:
      - "is er een deur ontgrendeld"
      - "zijn er deuren ontgrendeld"
    slots: { state: "unlocked" }
    response: "Ja, Achterdeur"
  - sentences:
      - "zijn alle deuren op slot"
      - "is elk slot op slot"
      - "zijn overal de deuren op slot"
      - "zijn de deuren overal op slot"
    slots: { state: "locked" }
    response: "Nee, Achterdeur niet"
  - sentences:
      - "welke deuren zijn ontgrendeld"
      - "welk slot is ontgrendeld"
    slots: { state: "unlocked" }
    response: "Achterdeur"
  - sentences:
      - "hoeveel deuren zijn op slot"
    slots: { state: "locked" }
    response: "1"
  - sentences:
      - "is er iemand thuis"
      - "zijn er mensen thuis"
    slots: { state: "thuis" }
    response: "Ja, Jan"
  - sentences:
      - "is iedereen thuis"
    slots: { state: "thuis" }
    response: "Nee, Piet niet"
  - sentences:
      - "wie is er thuis"
      - "wie is er allemaal thuis"
      - "wie zijn er thuis"
    slots: { state: "thuis" }
    response: "Jan"
  - sentences:
      - "hoeveel mensen zijn er thuis"
    slots: { state: "thuis" }
    response: "1"
