---
# HassGetState - name_state_floor

language: "nl"
floors:
  - name: "Beneden"
  - name: "Eerste verdieping"
  - name: "Tweede verdieping"

areas:
  - name: "Bijkeuken"
    floor: "Beneden"
  - name: "Garage"
    floor: "Eerste verdieping"
  - name: "Hal"
    floor: "Eerste verdieping"
  - name: "Slaapkamer"
    floor: "Tweede verdieping"
  - name: "Kantoor"
    floor: "Tweede verdieping"

entities:
  # on floor Beneden, for the floors used as an adverb
  - name: "Bijkeukendeur"
    domain: "cover"
    state: "open"
    area: "Bijkeuken"
  - name: "Bijkeukenslot"
    domain: "lock"
    state: "locked"
    area: "Bijkeuken"
  - name: "Bijkeukenraam"
    domain: "binary_sensor"
    state: "on"
    area: "Bijkeuken"
  - name: "Bijkeukensensor"
    domain: "binary_sensor"
    state: "on"
    area: "Bijkeuken"
  - name: "Garagedeur"
    domain: "cover"
    state: "open"
    area: "Garage"
  - name: "Voordeur"
    domain: "lock"
    state: "locked"
    area: "Hal"
  - name: "Dakraam"
    domain: "binary_sensor"
    state: "on"
    area: "Slaapkamer"
  - name: "Bewegingssensor"
    domain: "binary_sensor"
    state: "on"
    area: "Kantoor"

tests:
  - sentences:
      - "is de garagedeur open op de eerste verdieping"
    slots:
      name: "Garagedeur"
      state: "open"
      floor: "Eerste verdieping"
    response: "Ja"

  - sentences:
      - "is de voordeur op slot op de eerste verdieping"
    slots:
      name: "Voordeur"
      state: "locked"
      floor: "Eerste verdieping"
    response: "Ja"

  - sentences:
      - "is het dakraam open op de tweede verdieping"
    slots:
      name: "Dakraam"
      state: "on"
      floor: "Tweede verdieping"
    response: "Ja"

  - sentences:
      - "is de bewegingssensor bezet op de tweede verdieping"
    slots:
      name: "Bewegingssensor"
      state: "on"
      floor: "Tweede verdieping"
    response: "Ja"

  # floors used as an adverb
  - sentences:
      - "is de bijkeukendeur beneden open"
    slots:
      name: "Bijkeukendeur"
      state: "open"
      floor: "Beneden"
    response: "Ja"

  - sentences:
      - "zit het bijkeukenslot beneden op slot"
    slots:
      name: "Bijkeukenslot"
      state: "locked"
      floor: "Beneden"
    response: "Ja"

  - sentences:
      - "staat het bijkeukenraam beneden open"
    slots:
      name: "Bijkeukenraam"
      state: "on"
      floor: "Beneden"
    response: "Ja"

  - sentences:
      - "is de bijkeukensensor beneden bezet"
    slots:
      name: "Bijkeukensensor"
      state: "on"
      floor: "Beneden"
    response: "Ja"
