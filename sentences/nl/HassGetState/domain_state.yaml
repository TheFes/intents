---
# HassGetState - domain_state
# example: zijn alle lampen uit
# slots:
# - {domain}
# - {state}
# Singular and plural are kept apart (is er een lamp / zijn er lampen).
# Without a quantifier, "zijn de lampen uit" asks about all of them.

language: "nl"
data:
  # ---- lights ----
  - sentences:
      - "<gs_be_one> er [nog] een <gs_light_one> {on_off_states:state}"
      - "<gs_be_many> er [nog] <gs_light_many> {on_off_states:state}"
    example: "is er een lamp aan"
    inferred_domain: "light"
    response: "any"
  - sentences:
      - "<gs_be_many> (alle|de) <gs_light_many> {on_off_states:state}"
      - "<gs_be_one> <gs_light_every_one> {on_off_states:state}"
      - "<gs_be_many> overal de <gs_light_many> {on_off_states:state}"
      - "<gs_be_many> de <gs_light_many> overal {on_off_states:state}"
    example: "zijn alle lampen uit"
    inferred_domain: "light"
    response: "all"
  - sentences:
      - "welke <gs_light_many> <gs_be_many> [er] {on_off_states:state}"
      - "<gs_light_which_one> <gs_be_one> [er] {on_off_states:state}"
    example: "welke lampen zijn aan"
    inferred_domain: "light"
    response: "which"
  - sentences:
      - "<how_many> <gs_light_many> <gs_be_many> [er] {on_off_states:state}"
    example: "hoeveel lampen zijn aan"
    inferred_domain: "light"
    response: "how_many"

  # ---- lights with branden (state on) ----
  - sentences:
      - "{light_burn_one:state} er [nog] een <gs_light_one>"
      - "{light_burn_many:state} er [nog] <gs_light_many>"
    example: "brandt er een lamp"
    inferred_domain: "light"
    response: "any"
  - sentences:
      - "{light_burn_many:state} (alle|de) <gs_light_many>"
      - "{light_burn_one:state} <gs_light_every_one>"
      - "{light_burn_many:state} overal de <gs_light_many>"
      - "{light_burn_many:state} de <gs_light_many> overal"
    example: "branden alle lampen"
    inferred_domain: "light"
    response: "all"
  - sentences:
      - "welke <gs_light_many> {light_burn_many:state} [er]"
      - "<gs_light_which_one> {light_burn_one:state} [er]"
    example: "welke lampen branden er"
    inferred_domain: "light"
    response: "which"
  - sentences:
      - "<how_many> <gs_light_many> {light_burn_many:state} [er]"
    example: "hoeveel lampen branden er"
    inferred_domain: "light"
    response: "how_many"

  # ---- fans ----
  - sentences:
      - "<gs_be_one> er [nog] een <gs_fan_one> {on_off_states:state}"
      - "<gs_be_many> er [nog] <gs_fan_many> {on_off_states:state}"
    example: "is er een ventilator aan"
    inferred_domain: "fan"
    response: "any"
  - sentences:
      - "<gs_be_many> (alle|de) <gs_fan_many> {on_off_states:state}"
      - "<gs_be_one> <gs_fan_every_one> {on_off_states:state}"
      - "<gs_be_many> overal de <gs_fan_many> {on_off_states:state}"
      - "<gs_be_many> de <gs_fan_many> overal {on_off_states:state}"
    example: "zijn alle ventilatoren uit"
    inferred_domain: "fan"
    response: "all"
  - sentences:
      - "welke <gs_fan_many> <gs_be_many> [er] {on_off_states:state}"
      - "<gs_fan_which_one> <gs_be_one> [er] {on_off_states:state}"
    example: "welke ventilatoren zijn aan"
    inferred_domain: "fan"
    response: "which"
  - sentences:
      - "<how_many> <gs_fan_many> <gs_be_many> [er] {on_off_states:state}"
    example: "hoeveel ventilatoren zijn aan"
    inferred_domain: "fan"
    response: "how_many"

  # ---- switches ----
  - sentences:
      - "<gs_be_one> er [nog] een <gs_switch_one> {on_off_states:state}"
      - "<gs_be_many> er [nog] <gs_switch_many> {on_off_states:state}"
    example: "is er een schakelaar aan"
    inferred_domain: "switch"
    response: "any"
  - sentences:
      - "<gs_be_many> (alle|de) <gs_switch_many> {on_off_states:state}"
      - "<gs_be_one> <gs_switch_every_one> {on_off_states:state}"
      - "<gs_be_many> overal de <gs_switch_many> {on_off_states:state}"
      - "<gs_be_many> de <gs_switch_many> overal {on_off_states:state}"
    example: "zijn alle schakelaars uit"
    inferred_domain: "switch"
    response: "all"
  - sentences:
      - "welke <gs_switch_many> <gs_be_many> [er] {on_off_states:state}"
      - "<gs_switch_which_one> <gs_be_one> [er] {on_off_states:state}"
    example: "welke schakelaars zijn aan"
    inferred_domain: "switch"
    response: "which"
  - sentences:
      - "<how_many> <gs_switch_many> <gs_be_many> [er] {on_off_states:state}"
    example: "hoeveel schakelaars zijn aan"
    inferred_domain: "switch"
    response: "how_many"

  # ---- locks ----
  - sentences:
      - "<gs_be_lock_one> er [nog] een <gs_lock_one> {lock_states:state}"
      - "<gs_be_lock_many> er [nog] <gs_lock_many> {lock_states:state}"
    example: "is er een deur ontgrendeld"
    inferred_domain: "lock"
    response: "any"
  - sentences:
      - "<gs_be_lock_many> (alle|de) <gs_lock_many> {lock_states:state}"
      - "<gs_be_lock_one> <gs_lock_every_one> {lock_states:state}"
      - "<gs_be_lock_many> overal de <gs_lock_many> {lock_states:state}"
      - "<gs_be_lock_many> de <gs_lock_many> overal {lock_states:state}"
    example: "zijn alle deuren op slot"
    inferred_domain: "lock"
    response: "all"
  - sentences:
      - "welke <gs_lock_many> <gs_be_lock_many> [er] {lock_states:state}"
      - "<gs_lock_which_one> <gs_be_lock_one> [er] {lock_states:state}"
    example: "welke deuren zijn ontgrendeld"
    inferred_domain: "lock"
    response: "which"
  - sentences:
      - "<how_many> <gs_lock_many> <gs_be_lock_many> [er] {lock_states:state}"
    example: "hoeveel deuren zijn ontgrendeld"
    inferred_domain: "lock"
    response: "how_many"

  # ---- people / zones ----
  - sentences:
      - "is er [al|nog] iemand <gs_zone>"
      - "zijn er [al|nog] (mensen|personen) <gs_zone>"
    example: "is er iemand thuis"
    inferred_domain: "person"
    response: "any"
  - sentences:
      - "is iedereen <gs_zone>"
    example: "is iedereen thuis"
    inferred_domain: "person"
    response: "all"
  - sentences:
      - "wie is [er] [allemaal] <gs_zone>"
      - "wie zijn er [allemaal] <gs_zone>"
    example: "wie is er thuis"
    inferred_domain: "person"
    response: "which"
  - sentences:
      - "<how_many> (mensen|personen) zijn [er] <gs_zone>"
    example: "hoeveel mensen zijn er thuis"
    inferred_domain: "person"
    response: "how_many"
