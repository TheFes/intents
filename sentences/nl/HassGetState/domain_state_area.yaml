---
# HassGetState - domain_state_area
# example: welke lampen zijn aan in de keuken
# slots:
# - {area}
# - {domain}
# - {state}
# Singular and plural are kept apart (is er een lamp / zijn er lampen).
# Without a quantifier, "zijn de lampen uit" asks about all of them.

language: "nl"
data:
  # ---- lights ----
  - sentences:
      - "<gs_be_one> er [nog] een <gs_light_one> {on_off_states:state} <gs_in_area>"
      - "<gs_be_many> er [nog] <gs_light_many> {on_off_states:state} <gs_in_area>"
      - "<gs_be_one> er [nog] een {area} <gs_light_one> {on_off_states:state}"
      - "<gs_be_many> er [nog] {area} <gs_light_many> {on_off_states:state}"
      - "<gs_be_one> er [nog] <gs_in_area> een <gs_light_one> {on_off_states:state}"
      - "<gs_be_many> er [nog] <gs_in_area> <gs_light_many> {on_off_states:state}"
    example: "is er een lamp aan in de keuken"
    inferred_domain: "light"
    response: "any"
  - sentences:
      - "<gs_be_many> (alle|de) <gs_light_many> {on_off_states:state} <gs_in_area>"
      - "<gs_be_one> <gs_light_every_one> {on_off_states:state} <gs_in_area>"
      - "<gs_be_many> (alle|de) {area} <gs_light_many> {on_off_states:state}"
      - "<gs_be_many> (alle|de) <gs_light_many> <gs_in_area> {on_off_states:state}"
      - "<gs_be_one> <gs_light_every_one> <gs_in_area> {on_off_states:state}"
      - "<gs_be_many> <gs_in_area> (alle|de) <gs_light_many> {on_off_states:state}"
    example: "zijn alle lampen uit in de keuken"
    inferred_domain: "light"
    response: "all"
  - sentences:
      - "welke <gs_light_many> <gs_be_many> [er] {on_off_states:state} <gs_in_area>"
      - "<gs_light_which_one> <gs_be_one> [er] {on_off_states:state} <gs_in_area>"
      - "welke {area} <gs_light_many> <gs_be_many> [er] {on_off_states:state}"
      - "welke <gs_light_many> <gs_be_many> [er] <gs_in_area> {on_off_states:state}"
      - "welke <gs_light_many> <gs_in_area> <gs_be_many> [er] {on_off_states:state}"
      - "<gs_light_which_one> <gs_be_one> [er] <gs_in_area> {on_off_states:state}"
    example: "welke lampen zijn aan in de keuken"
    inferred_domain: "light"
    response: "which"
  - sentences:
      - "<how_many> <gs_light_many> <gs_be_many> [er] {on_off_states:state} <gs_in_area>"
      - "<how_many> {area} <gs_light_many> <gs_be_many> [er] {on_off_states:state}"
      - "<how_many> <gs_light_many> <gs_be_many> [er] <gs_in_area> {on_off_states:state}"
      - "<how_many> <gs_light_many> <gs_in_area> <gs_be_many> [er] {on_off_states:state}"
    example: "hoeveel lampen zijn aan in de keuken"
    inferred_domain: "light"
    response: "how_many"

  # ---- lights with branden (state on) ----
  - sentences:
      - "{light_burn_one:state} er [nog] een <gs_light_one> <gs_in_area>"
      - "{light_burn_many:state} er [nog] <gs_light_many> <gs_in_area>"
    example: "brandt er een lamp in de keuken"
    inferred_domain: "light"
    response: "any"
  - sentences:
      - "{light_burn_many:state} (alle|de) <gs_light_many> <gs_in_area>"
      - "{light_burn_one:state} <gs_light_every_one> <gs_in_area>"
    example: "branden alle lampen in de keuken"
    inferred_domain: "light"
    response: "all"
  - sentences:
      - "welke <gs_light_many> {light_burn_many:state} [er] <gs_in_area>"
      - "<gs_light_which_one> {light_burn_one:state} [er] <gs_in_area>"
    example: "welke lampen branden er in de keuken"
    inferred_domain: "light"
    response: "which"
  - sentences:
      - "<how_many> <gs_light_many> {light_burn_many:state} [er] <gs_in_area>"
    example: "hoeveel lampen branden er in de keuken"
    inferred_domain: "light"
    response: "how_many"

