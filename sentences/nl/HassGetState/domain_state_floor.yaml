---
# HassGetState - domain_state_floor
# example: welke lampen zijn aan op de eerste verdieping
# slots:
# - {floor}
# - {domain}
# - {state}
# Singular and plural are kept apart (is er een lamp / zijn er lampen).
# Without a quantifier, "zijn de lampen uit" asks about all of them.

language: "nl"
data:
  # ---- lights ----
  - sentences:
      - "<gs_be_one> er een <gs_light_one> {on_off_states:state} <gs_in_floor>"
      - "<gs_be_many> er <gs_light_many> {on_off_states:state} <gs_in_floor>"
      - "<gs_be_one> er een {floor} <gs_light_one> {on_off_states:state}"
      - "<gs_be_many> er {floor} <gs_light_many> {on_off_states:state}"
    example: "is er een lamp aan op de eerste verdieping"
    inferred_domain: "light"
    response: "any"
  - sentences:
      - "<gs_be_many> (alle|de) <gs_light_many> {on_off_states:state} <gs_in_floor>"
      - "<gs_be_one> <gs_light_every_one> {on_off_states:state} <gs_in_floor>"
      - "<gs_be_many> (alle|de) {floor} <gs_light_many> {on_off_states:state}"
    example: "zijn alle lampen uit op de eerste verdieping"
    inferred_domain: "light"
    response: "all"
  - sentences:
      - "welke <gs_light_many> <gs_be_many> {on_off_states:state} <gs_in_floor>"
      - "<gs_light_which_one> <gs_be_one> {on_off_states:state} <gs_in_floor>"
      - "welke {floor} <gs_light_many> <gs_be_many> {on_off_states:state}"
    example: "welke lampen zijn aan op de eerste verdieping"
    inferred_domain: "light"
    response: "which"
  - sentences:
      - "<how_many> <gs_light_many> <gs_be_many> {on_off_states:state} <gs_in_floor>"
      - "<how_many> {floor} <gs_light_many> <gs_be_many> {on_off_states:state}"
    example: "hoeveel lampen zijn aan op de eerste verdieping"
    inferred_domain: "light"
    response: "how_many"

  # ---- fans ----
