      - "<gs_be_many> <gs_in_floor> (alle|de) <gs_light_many> {on_off_states:state}"
    example: "zijn alle lampen uit op de eerste verdieping"
    inferred_domain: "light"
    response: "all"
  - sentences:
      - "welke <gs_light_many> <gs_be_many> [er] {on_off_states:state} <gs_in_floor>"
      - "<gs_light_which_one> <gs_be_one> [er] {on_off_states:state} <gs_in_floor>"
      - "welke {floor} <gs_light_many> <gs_be_many> [er] {on_off_states:state}"
      - "welke <gs_light_many> <gs_be_many> [er] <gs_in_floor> {on_off_states:state}"
      - "welke <gs_light_many> <gs_in_floor> <gs_be_many> [er] {on_off_states:state}"
      - "<gs_light_which_one> <gs_be_one> [er] <gs_in_floor> {on_off_states:state}"
    example: "welke lampen zijn aan op de eerste verdieping"
    inferred_domain: "light"
    response: "which"
  - sentences:
      - "<how_many> <gs_light_many> <gs_be_many> [er] {on_off_states:state} <gs_in_floor>"
      - "<how_many> {floor} <gs_light_many> <gs_be_many> [er] {on_off_states:state}"
