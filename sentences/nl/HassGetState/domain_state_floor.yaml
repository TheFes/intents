  - sentences:
      - "<gs_be_one> er [nog] een <gs_light_one> {on_off_states:state} <gs_in_floor>"
      - "<gs_be_many> er [nog] <gs_light_many> {on_off_states:state} <gs_in_floor>"
      - "<gs_be_one> er [nog] een {floor} <gs_light_one> {on_off_states:state}"
      - "<gs_be_many> er [nog] {floor} <gs_light_many> {on_off_states:state}"
      - "<gs_be_one> er [nog] <gs_in_floor> een <gs_light_one> {on_off_states:state}"
      - "<gs_be_many> er [nog] <gs_in_floor> <gs_light_many> {on_off_states:state}"
    example: "is er een lamp aan op de eerste verdieping"
    inferred_domain: "light"
    response: "any"
  - sentences:
      - "<gs_be_many> (alle|de) <gs_light_many> {on_off_states:state} <gs_in_floor>"
      - "<gs_be_one> <gs_light_every_one> {on_off_states:state} <gs_in_floor>"
      - "<gs_be_many> (alle|de) {floor} <gs_light_many> {on_off_states:state}"
