---
# HassGetState - name_zone
# example: is jan thuis
# slots:
# - {name}
# - {state}

language: "nl"
data:
  - sentences:
      - "(is|zit) {name} <gs_zone>"
      - "is {name} [al|nog] in de zone {zone:state}"
    example: "is jan thuis"
    name_domains:
      - "person"
    response: "one_yesno"
