---
# HassGetState - device_class_state_floor
# example: zijn alle ramen dicht op de tweede verdieping
# slots:
# - {floor}
# - {domain}
# - {device_class}
# - {state}
# Singular and plural are kept apart (is er een lamp / zijn er lampen).
# Without a quantifier, "zijn de lampen uit" asks about all of them.

language: "nl"
data:
  # ---- covers (by device class) ----
  - sentences:
      - "<gs_be_one> er een {cover_classes_one:device_class} {cover_states:state} <gs_in_floor>"
      - "<gs_be_many> er {cover_classes_many:device_class} {cover_states:state} <gs_in_floor>"
      - "<gs_be_one> er een {floor} {cover_classes_one:device_class} {cover_states:state}"
      - "<gs_be_many> er {floor} {cover_classes_many:device_class} {cover_states:state}"
    example: "is er een raam open op de eerste verdieping"
    inferred_domain: "cover"
    response: "any"
  - sentences:
      - "<gs_be_many> (alle|de) {cover_classes_many:device_class} {cover_states:state} <gs_in_floor>"
      - "<gs_be_one> {cover_classes_every_one:device_class} {cover_states:state} <gs_in_floor>"
      - "<gs_be_many> (alle|de) {floor} {cover_classes_many:device_class} {cover_states:state}"
    example: "zijn alle ramen dicht op de eerste verdieping"
    inferred_domain: "cover"
    response: "all"
  - sentences:
      - "welke {cover_classes_many:device_class} <gs_be_many> {cover_states:state} <gs_in_floor>"
      - "{cover_classes_which_one:device_class} <gs_be_one> {cover_states:state} <gs_in_floor>"
      - "welke {floor} {cover_classes_many:device_class} <gs_be_many> {cover_states:state}"
    example: "welke ramen zijn open op de eerste verdieping"
    inferred_domain: "cover"
    response: "which"
  - sentences:
      - "<how_many> {cover_classes_many:device_class} <gs_be_many> {cover_states:state} <gs_in_floor>"
      - "<how_many> {floor} {cover_classes_many:device_class} <gs_be_many> {cover_states:state}"
    example: "hoeveel ramen zijn open op de eerste verdieping"
    inferred_domain: "cover"
    response: "how_many"
