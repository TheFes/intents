---
# HassGetState - name_only
# example: wat is de buitentemperatuur
# slots: {name}

language: "nl"
data:
  - sentences:
      - "wat is <gs_value_of> [de|het] {name}"
      - "(wat|hoeveel|hoe (hoog|laag)) is [de|het] {name}"
      - "(hoe is|hoe staat het met) [de|het] {name}"
      - "(vertel|geef) me [<gs_value_of>] [de|het] {name}"
      - "weet je [de|het] {name}"
    example: "wat is de buitentemperatuur"
    name_domains: "default"
    response: "one"
  - sentences:
      - "wat is de waarde van [de|het] {name}"
      - "wat is [de|het] {name}"
      - "vertel me [de|het] {name}"
    example: "wat is de waarde van de Buitentemperatuur"
    name_domains:
      - sensor
    response: "one"
    speech_to_phrase: true
