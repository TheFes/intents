---
# HassGetState - name_where
# example: waar is jan
# slots: {name}

language: "nl"
data:
  - sentences:
      - "waar (is|zit) {name} [nu]"
      - "waar bevindt {name} zich [nu]"
      - "waar kan ik {name} vinden"
    example: "waar is jan"
    name_domains:
      - "person"
    response: "where"
