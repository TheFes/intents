---
# HassGetState - name_state_floor
# example: is het slaapkamerraam open op de tweede verdieping
# slots:
# - {name}
# - {state}
# - {floor}

language: "nl"
data:
  # covers
  - sentences:
      - "(<gs_be_one>|<gs_be_many>) [de|het] {name} {cover_states:state} <gs_in_floor>"
    example: "is de garagedeur open op de eerste verdieping"
    name_domains:
      - "cover"
    response: "one_yesno"

  # locks
  - sentences:
      - "(<gs_be_lock_one>|<gs_be_lock_many>) [de|het] {name} {lock_states:state} <gs_in_floor>"
    example: "is de voordeur op slot op de eerste verdieping"
    name_domains:
      - "lock"
    response: "one_yesno"

  # binary sensors - openings
  - sentences:
      - "(<gs_be_one>|<gs_be_many>) [de|het] {name} {bs_open_states:state} <gs_in_floor>"
    example: "is het slaapkamerraam open op de tweede verdieping"
    name_domains:
      - "binary_sensor"
    response: "one_yesno"

  # binary sensors - occupancy
  - sentences:
      - "<gs_be_occupancy> [de|het] {name} {bs_occupancy_states:state} <gs_in_floor>"
    example: "is de sensor bezet op de tweede verdieping"
    name_domains:
      - "binary_sensor"
    response: "one_yesno"
