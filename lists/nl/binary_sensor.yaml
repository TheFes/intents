language: nl
lists:
  # open / dicht -> on / off (door, garage_door, window)
  bs_open_states:
    values:
      - in: (open|geopend)
        out: "on"
      - in: (dicht|gesloten)
        out: "off"

  # occupancy
  bs_occupancy_states:
    values:
      - in: (bezet|in gebruik)
        out: "on"
      - in: (leeg|onbezet|vrij|niet bezet)
        out: "off"
