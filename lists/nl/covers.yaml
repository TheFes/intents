language: nl
lists:
  cover_classes:
    values:
      - in: (luifel[s]|[zonne]scherm[en]|markies|markiezen|zonwering)
        out: awning
      - in: (jaloezie[ën]|luxaflex|lamellen)
        out: blind
      - in: ([over]gordijn[en]|vitrage[s])
        out: curtain
      - in: deur[en]
        out: door
      - in: garage[ ]deur[en]
        out: garage
      - in: (hek[ken]|poort[en])
        out: gate
      - in: (screen[s]|rolgordijn[en]|vouwgordijn[en])
        out: shade
      - in: (rolluik[en]|shutter[s])
        out: shutter
      - in: ([dak]raam|[dak]ramen)
        out: window
  # Cover classes with their article ("het gordijn", "de gordijnen"), for
  # templates that do not add an article themselves.
  cover_classes_the:
    values:
      - in: ([de] luifel|[de|alle] luifels|[het] [zonne]scherm|[de|alle] [zonne]schermen|[de] markies|[de|alle] markiezen|[de] zonwering)
        out: awning
      - in: ([de] jaloezie|[de|alle] jaloezieën|[de|alle] luxaflex|[de|alle] lamellen)
        out: blind
      - in: ([het] [over]gordijn|[de|alle] [over]gordijnen|[de] vitrage|[de|alle] vitrages)
        out: curtain
      - in: ([de] deur|[de|alle] deuren)
        out: door
      - in: ([de] garage[ ]deur|[de|alle] garage[ ]deuren)
        out: garage
      - in: ([het] hek|[de|alle] hekken|[de] poort|[de|alle] poorten)
        out: gate
      - in: ([de] screen|[de|alle] screens|[het] rolgordijn|[de|alle] rolgordijnen|[het] vouwgordijn|[de|alle] vouwgordijnen)
        out: shade
      - in: ([het] rolluik|[de|alle] rolluiken|[de] shutter|[de|alle] shutters)
        out: shutter
      - in: ([het] [dak]raam|[de|alle] [dak]ramen)
        out: window
  # Cover classes for HassGetState: singular without article (is er een raam open)
  cover_classes_one:
    values:
      - in: "(luifel|markies|zonwering|zonnescherm|scherm)"
        out: awning
      - in: "(jaloezie|luxaflex)"
        out: blind
      - in: "(vitrage|gordijn|overgordijn)"
        out: curtain
      - in: "deur"
        out: door
      - in: "(garagedeur|garage deur)"
        out: garage
      - in: "(poort|hek)"
        out: gate
      - in: "(screen|rolgordijn|vouwgordijn)"
        out: shade
      - in: "(shutter|rolluik)"
        out: shutter
      - in: "(raam|dakraam)"
        out: window
  # Cover classes for HassGetState: plural without article (zijn alle ramen dicht)
  cover_classes_many:
    values:
      - in: "(luifels|markiezen|zonneschermen|schermen)"
        out: awning
      - in: "(jaloezieën|luxaflex|lamellen)"
        out: blind
      - in: "(gordijnen|overgordijnen|vitrages)"
        out: curtain
      - in: "deuren"
        out: door
      - in: "(garagedeuren|garage deuren)"
        out: garage
      - in: "(poorten|hekken)"
        out: gate
      - in: "(screens|rolgordijnen|vouwgordijnen)"
        out: shade
      - in: "(shutters|rolluiken)"
        out: shutter
      - in: "(ramen|dakramen)"
        out: window
  # Cover classes for HassGetState: welke/welk with the right gender (welk raam staat open)
  cover_classes_which_one:
    values:
      - in: "(welke (luifel|markies|zonwering)|welk (zonnescherm|scherm))"
        out: awning
      - in: "welke (jaloezie|luxaflex)"
        out: blind
      - in: "(welke vitrage|welk (gordijn|overgordijn))"
        out: curtain
      - in: "welke deur"
        out: door
      - in: "welke (garagedeur|garage deur)"
        out: garage
      - in: "(welke poort|welk hek)"
        out: gate
      - in: "(welke screen|welk (rolgordijn|vouwgordijn))"
        out: shade
      - in: "(welke shutter|welk rolluik)"
        out: shutter
      - in: "welk (raam|dakraam)"
        out: window
  # Cover classes for HassGetState: elke/elk with the right gender (is elk raam dicht)
  cover_classes_every_one:
    values:
      - in: "((elke|iedere) (luifel|markies|zonwering)|(elk|ieder) (zonnescherm|scherm))"
        out: awning
      - in: "(elke|iedere) (jaloezie|luxaflex)"
        out: blind
      - in: "((elke|iedere) vitrage|(elk|ieder) (gordijn|overgordijn))"
        out: curtain
      - in: "(elke|iedere) deur"
        out: door
      - in: "(elke|iedere) (garagedeur|garage deur)"
        out: garage
      - in: "((elke|iedere) poort|(elk|ieder) hek)"
        out: gate
      - in: "((elke|iedere) screen|(elk|ieder) (rolgordijn|vouwgordijn))"
        out: shade
      - in: "((elke|iedere) shutter|(elk|ieder) rolluik)"
        out: shutter
      - in: "(elk|ieder) (raam|dakraam)"
        out: window
  cover_states:
    values:
      - in: (open|geopend)
        out: open
      - in: (dicht|gesloten)
        out: closed
      - in: aan het (openen|opengaan|open gaan)
        out: opening
      - in: aan het (sluiten|dichtgaan|dicht gaan)
        out: closing
  # doe de gordijnen half open / sluit het rolluik half
  cover_position_half:
    values:
      - in: half
        out: 50
